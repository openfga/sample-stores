name: Customer-facing multi-tenant MCP Gateway
model: |
  model
    schema 1.1

  type agent

  type organization
    relations
      define agent : [agent]

  type tool
    relations
      # The tool policies are per-organization
      define organization : [organization]
      define caller: [agent:*, agent, agent with $expression]
      define can_call: caller and agent from organization

tuples:
  - user: agent:triage-bot
    relation: agent
    object: organization:acme

  - user: agent:assistant
    relation: agent
    object: organization:acme

  - user: agent:external
    relation: agent
    object: organization:globex

  # The Slack tools are enabled for the organization
  - user: organization:acme
    relation: organization
    object: tool:acme_slack_send_message

  - user: organization:acme
    relation: organization
    object: tool:acme_slack_read_channel

  # Every agent in the acme organization can call acme_slack_read_channel.
  - user: agent:*
    relation: caller
    object: tool:acme_slack_read_channel

  # The assistant agent can call acme_slack_send_message for every channel:
  - user: agent:assistant
    relation: caller
    object: tool:acme_slack_send_message

  # The triage-bot agent can only use acme_slack_send_message for product-announcements
  - user: agent:triage-bot
    relation: caller
    object: tool:acme_slack_send_message
    condition:
      name: $expression
      context:
        expression: "channel_name == '#product-announcements'"
        parameters:
          channel_name: string

tests:
  - name: dynamic-rbac-example
    check:
      # triage-bot can post to the channel allowed by its expression
      - user: agent:triage-bot
        object: tool:acme_slack_send_message
        context:
          channel_name: "#product-announcements"
        assertions:
          can_call: true

      # assistant has an unconditional grant, so any channel is allowed
      - user: agent:assistant
        object: tool:acme_slack_send_message
        context:
          channel_name: "#general"
        assertions:
          can_call: true

      # An agent from another organization cannot call Acme's tools
      - user: agent:external
        object: tool:acme_slack_read_channel
        assertions:
          can_call: false

      # triage-bot cannot post to channels outside its expression
      - user: agent:triage-bot
        object: tool:acme_slack_send_message
        context:
          channel_name: "#general"
        assertions:
          can_call: false

      # Channel context isn't needed because no conditional grant exists for this tool
      - user: agent:triage-bot
        object: tool:acme_slack_read_channel
        assertions:
          can_call: true
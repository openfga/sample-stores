name: CRM Authorization Model Tests
model_file: ./model.fga

tuples:
  - user: user:alice
    relation: admin
    object: organization:acme
  - user: user:bob
    relation: sales_manager
    object: organization:acme
  - user: user:charlie
    relation: sales_rep
    object: organization:acme

  - user: organization:acme
    relation: organization
    object: account:mega-corp
  - user: user:charlie
    relation: owner
    object: account:mega-corp

  - user: account:mega-corp
    relation: account
    object: contact:john-doe
  - user: user:charlie
    relation: owner
    object: contact:john-doe

  - user: organization:acme
    relation: organization
    object: lead:new-prospect
  - user: user:charlie
    relation: owner
    object: lead:new-prospect

  - user: account:mega-corp
    relation: account
    object: opportunity:big-deal
  - user: user:charlie
    relation: owner
    object: opportunity:big-deal

  - user: organization:acme
    relation: organization
    object: engagement:call-001
  - user: user:charlie
    relation: owner
    object: engagement:call-001

  - user: organization:acme
    relation: organization
    object: note:meeting-notes
  - user: user:charlie
    relation: owner
    object: note:meeting-notes

  - user: organization:acme
    relation: organization
    object: task:follow-up
  - user: user:charlie
    relation: owner
    object: task:follow-up

tests:
  - name: Admin has full CRM access
    check:
      - user: user:alice
        object: account:mega-corp
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
      - user: user:alice
        object: opportunity:big-deal
        assertions:
          can_view: true
          can_edit: true
          can_delete: true

  - name: Sales manager can view and edit accounts
    check:
      - user: user:bob
        object: account:mega-corp
        assertions:
          can_view: true
          can_edit: true
          can_delete: false

  - name: Account owner can view and edit but not delete
    check:
      - user: user:charlie
        object: account:mega-corp
        assertions:
          can_view: true
          can_edit: true
          can_delete: false

  - name: Contact inherits from account owner
    check:
      - user: user:charlie
        object: contact:john-doe
        assertions:
          can_view: true
          can_edit: true

  - name: Lead owner can convert
    check:
      - user: user:charlie
        object: lead:new-prospect
        assertions:
          can_view: true
          can_edit: true
          can_convert: true
      - user: user:bob
        object: lead:new-prospect
        assertions:
          can_view: true
          can_convert: true

  - name: Opportunity follows account ownership
    check:
      - user: user:charlie
        object: opportunity:big-deal
        assertions:
          can_view: true
          can_edit: true
          can_close: true

  - name: Sales manager can view and close opportunities
    check:
      - user: user:bob
        object: opportunity:big-deal
        assertions:
          can_view: true
          can_edit: true
          can_close: true
          can_delete: false

  - name: Engagement owner and manager visibility
    check:
      - user: user:charlie
        object: engagement:call-001
        assertions:
          can_view: true
          can_edit: true
      - user: user:bob
        object: engagement:call-001
        assertions:
          can_view: true
          can_edit: false

  - name: Note owner can edit and delete their own notes
    check:
      - user: user:charlie
        object: note:meeting-notes
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
      - user: user:bob
        object: note:meeting-notes
        assertions:
          can_view: true
          can_edit: false
          can_delete: false

  - name: Task owner can complete
    check:
      - user: user:charlie
        object: task:follow-up
        assertions:
          can_view: true
          can_edit: true
          can_complete: true
      - user: user:bob
        object: task:follow-up
        assertions:
          can_view: true
          can_edit: false
          can_complete: false

  - name: List objects charlie can access
    list_objects:
      - user: user:charlie
        type: account
        assertions:
          can_view:
            - account:mega-corp
          can_edit:
            - account:mega-corp
      - user: user:charlie
        type: contact
        assertions:
          can_view:
            - contact:john-doe
          can_edit:
            - contact:john-doe
      - user: user:charlie
        type: opportunity
        assertions:
          can_view:
            - opportunity:big-deal
          can_edit:
            - opportunity:big-deal

  - name: List objects bob can access
    list_objects:
      - user: user:bob
        type: account
        assertions:
          can_view:
            - account:mega-corp
      - user: user:bob
        type: lead
        assertions:
          can_view:
            - lead:new-prospect

  - name: List users with access to account
    list_users:
      - object: account:mega-corp
        user_filter:
          - type: user
        assertions:
          can_view:
            users:
              - user:alice
              - user:bob
              - user:charlie
          can_edit:
            users:
              - user:alice
              - user:bob
              - user:charlie

  - name: List users with access to note
    list_users:
      - object: note:meeting-notes
        user_filter:
          - type: user
        assertions:
          can_view:
            users:
              - user:alice
              - user:bob
              - user:charlie
          can_edit:
            users:
              - user:alice
              - user:charlie
